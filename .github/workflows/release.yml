name: Release Binaries

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # 先由单个 job 创建 Release，矩阵 job 仅追加上传资产。
  # 否则多个矩阵 job 并发执行 action-gh-release 会各自创建 Release，
  # 产生重复 Release 并在 finalize 时因 tag_name 冲突失败。
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes ""

  build:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and package
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          CGO_ENABLED=0 GOOS=linux GOARCH=$GOARCH go build -ldflags="-s -w" -o openlist-strm .
          tar czf openlist-strm_${VERSION}_linux_${GOARCH}.tar.gz openlist-strm config.example.yaml

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: openlist-strm_*.tar.gz
